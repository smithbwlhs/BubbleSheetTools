# Production setup for a DigitalOcean droplet:
#   app   - BubbleSheetTools (not exposed to the internet directly)
#   caddy - HTTPS reverse proxy with automatic Let's Encrypt certificates
services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    expose:
      - "8000"
    # Hard memory cap: if the app ever runs out, Docker restarts just the app
    # (in seconds) instead of the whole droplet freezing. Uploads are read one
    # page at a time, so normal use stays far below this. Override with
    # APP_MEMORY_LIMIT in .env (e.g. 1500m on a larger droplet).
    mem_limit: ${APP_MEMORY_LIMIT:-900m}
    memswap_limit: ${APP_MEMORY_LIMIT:-900m}   # no swapping inside the container

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
