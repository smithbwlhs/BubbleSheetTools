# Production setup for a DigitalOcean droplet:
#   app   - BubbleSheetTools (not exposed to the internet directly)
#   caddy - HTTPS reverse proxy with automatic Let's Encrypt certificates
services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
